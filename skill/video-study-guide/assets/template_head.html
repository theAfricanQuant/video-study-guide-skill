<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5FA; --sheet:#FFFFFF; --ink:#1A1E3A; --muted:#5B6180; --rule:#D7DBE8;
  --coral:{{ACCENT}}; --coral-soft:{{ACCENT_SOFT}}; --teal:#11807F; --teal-soft:#D8F0EE;
  --gold:#C98F12; --gold-soft:#FBEFD2; --plum:#6B4FA0; --plum-soft:#ECE5F7;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12152A; --sheet:#1B1F38; --ink:#E8EAF4; --muted:#A3A8C3; --rule:#2E3352;
    --coral:{{ACCENT_DARK}}; --coral-soft:{{ACCENT_SOFT_DARK}}; --teal:#3CC2BF; --teal-soft:#16302F;
    --gold:#F0B83A; --gold-soft:#352C16; --plum:#A88BE0; --plum-soft:#2A2340;
  }
}
:root[data-theme="dark"]{
  --paper:#12152A; --sheet:#1B1F38; --ink:#E8EAF4; --muted:#A3A8C3; --rule:#2E3352;
  --coral:{{ACCENT_DARK}}; --coral-soft:{{ACCENT_SOFT_DARK}}; --teal:#3CC2BF; --teal-soft:#16302F;
  --gold:#F0B83A; --gold-soft:#352C16; --plum:#A88BE0; --plum-soft:#2A2340;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem); scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--coral);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:4px}
img,svg{max-width:100%}

/* progress bar */
#progress{position:fixed;top:0;left:0;height:4px;width:100%;transform:scaleX(0);transform-origin:0 0;background:var(--coral);z-index:30;will-change:transform}

/* chapter nav */
nav.toc{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
nav.toc ol{list-style:none;margin:0 auto;padding:.6rem 1rem;display:flex;gap:.4rem;overflow-x:auto;max-width:72rem;scrollbar-width:none}
nav.toc ol::-webkit-scrollbar{display:none}
nav.toc a{display:block;white-space:nowrap;text-decoration:none;font-size:.85rem;font-weight:600;color:var(--muted);padding:.3rem .7rem;border-radius:999px;border:1px solid transparent}
nav.toc a:hover{color:var(--ink);border-color:var(--rule)}
nav.toc a.active{background:var(--ink);color:var(--paper)}

/* hero */
.hero{max-width:72rem;margin:0 auto;padding:clamp(2.5rem,7vw,5.5rem) 1.25rem 2rem;display:grid;grid-template-columns:1.15fr .85fr;gap:2.5rem;align-items:center}
.hero .who{font-weight:600;color:var(--muted);margin:0 0 1rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,8.5vw,6.2rem);line-height:.95;letter-spacing:-.015em;margin:0 0 1.25rem}
.hero .dek{font-size:1.2rem;color:var(--muted);max-width:34rem;margin:0 0 1.5rem}
.hero .meta{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;padding:.35rem .75rem;border-radius:999px;background:var(--sheet);border:1px solid var(--rule)}
.hero-art{background:var(--sheet);border:1px solid var(--rule);border-radius:28px;padding:1.25rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* layout */
main{max-width:72rem;margin:0 auto;padding:0 1.25rem 5rem}
.chapter{padding:4.5rem 0 1rem;border-top:1px solid var(--rule)}
.chapter-head{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:start;margin-bottom:1.75rem;max-width:52rem}
.chapter-num{font-family:var(--display);font-size:clamp(3.5rem,8vw,5.5rem);line-height:.8;color:var(--coral)}
.chapter h2{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,5vw,3.3rem);line-height:1.02;margin:0 0 .5rem;letter-spacing:-.01em}
.chapter-head p{margin:0;color:var(--muted);font-size:1.1rem}
.prose{max-width:42rem}
.prose p{margin:0 0 1.15rem}
h3{font-size:1.3rem;font-weight:800;line-height:1.25;margin:2.4rem 0 .6rem;letter-spacing:-.01em}
h4{font-size:1.05rem;font-weight:700;margin:1.4rem 0 .4rem}
strong{font-weight:700}

/* two-column with diagram */
.split{display:grid;grid-template-columns:minmax(0,42rem) minmax(0,1fr);gap:2.5rem;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}

/* figure */
figure.diagram{margin:2rem 0;background:var(--sheet);border:1px solid var(--rule);border-radius:22px;padding:1.25rem 1.25rem 1rem;max-width:56rem}
figure.diagram svg{display:block;width:100%;height:auto}
figure.diagram figcaption{font-size:.9rem;color:var(--muted);margin-top:.75rem;line-height:1.5}
.svg-ink{fill:var(--ink)} .svg-muted{fill:var(--muted)} .svg-sheet{fill:var(--sheet)} .svg-paper{fill:var(--paper)}
.stroke-ink{stroke:var(--ink)} .stroke-rule{stroke:var(--rule)} .stroke-muted{stroke:var(--muted)}
.f-coral{fill:var(--coral)} .f-coral-soft{fill:var(--coral-soft)} .f-teal{fill:var(--teal)} .f-teal-soft{fill:var(--teal-soft)}
.f-gold{fill:var(--gold)} .f-gold-soft{fill:var(--gold-soft)} .f-plum{fill:var(--plum)} .f-plum-soft{fill:var(--plum-soft)}
.s-coral{stroke:var(--coral)} .s-teal{stroke:var(--teal)} .s-gold{stroke:var(--gold)} .s-plum{stroke:var(--plum)}
svg text{font-family:var(--body)}
.t-sm{font-size:13px} .t-md{font-size:15px;font-weight:600} .t-lg{font-size:19px;font-weight:800} .t-xl{font-size:26px;font-weight:800} .t-disp{font-family:var(--display)!important;font-size:30px}

/* analogy box */
.analogy{display:grid;grid-template-columns:3rem 1fr;gap:1rem;background:var(--teal-soft);border-radius:18px;padding:1.1rem 1.25rem;margin:1.6rem 0;max-width:42rem}
.analogy .icon{font-size:1.9rem;line-height:1}
.analogy b{display:block;color:var(--teal);font-size:.9rem;margin-bottom:.15rem}
.analogy p{margin:0}

/* story */
.story{background:var(--sheet);border:1px solid var(--rule);border-radius:22px;padding:1.5rem 1.6rem .4rem;margin:1.8rem 0;max-width:46rem;position:relative}
.story::before{content:"";position:absolute;left:0;top:1.6rem;bottom:1.6rem;width:5px;border-radius:0 5px 5px 0;background:var(--coral)}
.story .label{font-size:.82rem;font-weight:700;color:var(--coral);margin:0 0 .2rem}
.story h4{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.1;margin:0 0 .8rem}
.story p{margin:0 0 1rem}
.story .lesson{background:var(--coral-soft);border-radius:12px;padding:.7rem 1rem;font-weight:600;margin-bottom:1.1rem}

/* plain-english term */
.term{border-bottom:2px dotted var(--plum);cursor:help;position:relative}
.term:focus{outline:none}
.term .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:min(18rem,80vw);background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:500;line-height:1.45;padding:.6rem .75rem;border-radius:10px;display:none;pointer-events:none;z-index:40}
.term:hover .tip,.term:focus .tip{display:block}
@media (max-width:640px){.term .tip{position:fixed;left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));top:auto;width:auto;transform:none}}

/* cards grid */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin:1.5rem 0;max-width:60rem}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:1.1rem 1.2rem}
.card .k{font-family:var(--display);font-size:1.6rem;line-height:1.1;margin:0 0 .4rem}
.card p{margin:0;font-size:.97rem}
.card.teal{border-top:5px solid var(--teal)} .card.coral{border-top:5px solid var(--coral)} .card.gold{border-top:5px solid var(--gold)} .card.plum{border-top:5px solid var(--plum)}

/* pull quote */
.pull{font-family:var(--display);font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.15;max-width:44rem;margin:2.5rem 0;padding-left:1.25rem;border-left:5px solid var(--gold)}

/* checklist */
.check{list-style:none;padding:0;margin:1rem 0;max-width:44rem}
.check li{display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;padding:.65rem 0;border-bottom:1px dashed var(--rule)}
.check li::before{content:"";width:1.1rem;height:1.1rem;margin-top:.3rem;border:2px solid var(--teal);border-radius:5px}

/* quiz */
details.quiz{background:var(--plum-soft);border-radius:16px;padding:.9rem 1.2rem;margin:1.5rem 0;max-width:42rem}
details.quiz summary{cursor:pointer;font-weight:700;list-style:none}
details.quiz summary::-webkit-details-marker{display:none}
details.quiz summary::before{content:"Quick check  ";color:var(--plum)}
details.quiz[open] summary{margin-bottom:.5rem}
details.quiz p{margin:0}

/* glossary */
dl.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:.9rem;max-width:64rem}
dl.gloss div{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:.9rem 1rem}
dl.gloss dt{font-weight:800}
dl.gloss dd{margin:.2rem 0 0;color:var(--muted);font-size:.97rem}

.note{font-size:.92rem;color:var(--muted);max-width:46rem}
footer{max-width:72rem;margin:0 auto;padding:2rem 1.25rem 4rem;border-top:1px solid var(--rule);color:var(--muted);font-size:.9rem}

/* playbook steps */
.watch{display:inline-flex;align-items:center;gap:.6rem;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;padding:.7rem 1.1rem;border-radius:999px;margin-top:.4rem}
.watch:hover{opacity:.9}
ol.playbook{list-style:none;counter-reset:pb;padding:0;margin:1.5rem 0;max-width:52rem}
ol.playbook>li{counter-increment:pb;display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:0 0 1.6rem;position:relative}
ol.playbook>li::before{content:counter(pb);display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;font-size:1.2rem;position:relative;z-index:1}
ol.playbook>li:not(:last-child)::after{content:"";position:absolute;left:1.55rem;top:3.2rem;bottom:0;width:3px;background:var(--rule)}
ol.playbook h4{margin:.55rem 0 .35rem;font-size:1.15rem}
ol.playbook p{margin:0 0 .5rem}
ol.playbook .when{display:inline-block;font-size:.8rem;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:.15rem .6rem;border-radius:999px;margin-bottom:.3rem}
ol.playbook ul{margin:.3rem 0 0;padding-left:1.1rem}
ol.playbook ul li{margin:.2rem 0}
/* ---- lesson components (code, outputs, tables, warnings, parts, photos) ---- */

pre.code{background:#151922;color:#E6E9F2;border-radius:14px;padding:1rem 1.1rem;overflow-x:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:1.1rem 0;max-width:46rem;position:relative}
pre.code .k{color:#FFB454}pre.code .c{color:#7F8AA3;font-style:italic}pre.code .s{color:#9BD67E}pre.code .n{color:#F78C6C}
pre.code[data-lang]::before{content:attr(data-lang);position:absolute;top:.45rem;right:.7rem;font:600 11px/1 var(--body);color:#7F8AA3;text-transform:uppercase;letter-spacing:.06em}
pre.out{background:var(--sheet);color:var(--ink);border:1px dashed var(--rule);border-radius:12px;padding:.8rem 1rem;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-width:46rem;margin:.4rem 0 1.2rem}
pre.out::before{content:"real output";display:block;font:700 10.5px/1 var(--body);color:var(--teal);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.45rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--gold-soft);padding:.05rem .3rem;border-radius:5px}
pre code{background:none;padding:0;font-size:inherit}
.tablewrap{overflow-x:auto;max-width:56rem;margin:1.3rem 0}
table.cmp{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--sheet);border-radius:14px;overflow:hidden}
table.cmp th,table.cmp td{padding:.65rem .8rem;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
table.cmp th{background:var(--paper);font-weight:800}
table.cmp td:first-child{font-weight:700}
.warn{background:var(--coral-soft);border-left:5px solid var(--coral);border-radius:12px;padding:.8rem 1rem;margin:1.2rem 0;max-width:44rem}
.warn b{color:var(--coral)}
.verify{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:12px;padding:.8rem 1rem;margin:1.2rem 0;max-width:44rem}
.verify b{color:var(--teal)}
.part{margin:4rem 0 0;padding:1.2rem 1.4rem;border-radius:18px;background:var(--ink);color:var(--paper)}
.part p{margin:0;color:var(--paper);opacity:.8}
.part h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);margin:.1rem 0 .2rem}
.part .lbl{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.analogy.de{background:var(--plum-soft)}.analogy.de b{color:var(--plum)}
.analogy.ng{background:var(--gold-soft)}.analogy.ng b{color:var(--gold)}
.split>*,.prose,.story,figure.diagram,.grid3>*{min-width:0}
pre.code,pre.out{max-width:min(46rem,100%)}
:not(pre)>code{overflow-wrap:anywhere}
.story{max-width:min(46rem,100%)}
.analogy>div{min-width:0}
.aph{margin:0 0 .75rem}
.aph img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--rule)}
.aph figcaption{overflow-wrap:anywhere;font-size:.72rem;line-height:1.35;color:var(--muted);margin-top:.35rem}
.aph a{color:inherit}
svg .mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
